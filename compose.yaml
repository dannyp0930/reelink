name: reelink

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: reelink
      POSTGRES_PASSWORD: reelink
      POSTGRES_DB: reelink
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reelink -d reelink"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
